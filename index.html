<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>ArgonDesk — Gemini 工作台</title><link rel="icon" href="/app-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head>
<body>
<svg class="svg-library" aria-hidden="true"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3Z"/><path d="M3 11h18"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4m-6 7-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 1 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 1)"/></symbol>
<symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
<symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6L10 14m0-10H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v13h5"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol>
<symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10M6 5a9 9 0 1 0 12 0"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></symbol>
</defs></svg>
<div class="app-shell">
<aside class="sidebar">
<a class="brand" href="#workspace" aria-label="ArgonDesk"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>ArgonDesk<small data-i18n="tagline"></small></span></a>
<nav aria-label="Navigation"><button class="nav-item active" data-page="workspace" data-i18n-aria="workspace" aria-current="page"><svg><use href="#i-grid"/></svg><span data-i18n="workspace"></span></button><button class="nav-item" data-page="connection" data-i18n-aria="connection"><svg><use href="#i-link"/></svg><span data-i18n="connection"></span><span id="nav-connection-dot" class="nav-dot"></span></button><button class="nav-item" data-page="activity" data-i18n-aria="activity"><svg><use href="#i-activity"/></svg><span data-i18n="activity"></span><span id="nav-history-count" class="nav-count">0</span></button></nav>
<div class="sidebar-bottom"><div class="sidebar-folder"><svg><use href="#i-folder"/></svg><span id="sidebar-folder">…</span></div><button class="preferences-link" data-preferences><svg><use href="#i-settings"/></svg><span data-i18n="preferences"></span></button><div class="sidebar-meta"><span data-i18n="localFirstShort"></span><span>v0.4.1</span></div></div>
</aside>
<main><header class="topbar"><div class="breadcrumb"><span>ArgonDesk</span><span>/</span><b id="page-breadcrumb"></b></div><div class="topbar-right"><span class="local-indicator"><i id="service-dot" class="live-dot"></i><span id="service-label"></span></span><button class="icon-button" data-preferences data-i18n-aria="preferences"><svg><use href="#i-settings"/></svg></button><button id="shutdown" class="icon-button" data-i18n-aria="shutdown"><svg><use href="#i-power"/></svg></button></div></header>
<div id="offline-banner" class="offline-banner" hidden></div>
<div class="page-wrap">
<section id="page-workspace" class="page">
<div class="page-heading"><div><h1 data-i18n="workspace"></h1><p data-i18n="intro"></p></div><span class="quiet desktop-only" data-i18n="localFirst"></span></div>
<div class="status-grid">
<button class="connection-summary" data-page="connection"><span class="summary-icon"><svg><use href="#i-link"/></svg></span><span><span class="section-label" data-i18n="tunnel"></span><strong id="home-tunnel-status"></strong><small id="home-tunnel-detail"></small></span><i id="home-tunnel-dot" class="status-dot"></i></button>
<button class="connection-summary" data-page="activity"><span class="summary-icon"><svg><use href="#i-activity"/></svg></span><span><span class="section-label" data-i18n="toolConnection"></span><strong id="home-tool-status"></strong><small id="home-tool-detail"></small></span><i id="home-tool-dot" class="status-dot"></i></button>
</div>
<div class="card workspace-card">
<div class="card-top"><span class="section-label" data-i18n="currentFolder"></span><button id="copy-root" class="text-button"><svg><use href="#i-copy"/></svg><span data-i18n="copyPath"></span></button></div>
<div class="folder-row"><div class="folder-art"><svg><use href="#i-folder"/></svg></div><div class="folder-detail"><h2 id="folder-name">…</h2><div id="root" class="path">…</div></div><button id="choose" class="button secondary"><svg><use href="#i-folder"/></svg><span data-i18n="choose"></span></button></div>
<div class="access-controls"><div class="permission-field"><label for="access" data-i18n="access"></label><select id="access"><option value="read" data-i18n="read"></option><option value="edit" data-i18n="edit"></option></select></div><div id="access-state" class="access-state"><span id="status-text"></span><small id="enabled-description"></small></div><button id="toggle" class="button primary"><svg><use href="#i-play"/></svg><span></span></button></div>
<div class="folder-footnote"><svg><use href="#i-shield"/></svg><span data-i18n="folderHint"></span></div>
</div>
<div class="start-strip"><div><strong data-i18n="startTitle"></strong><p data-i18n="startHelp"></p></div><a class="button secondary" href="https://gemini.google.com/app?hl=en" target="_blank" rel="noreferrer"><span data-i18n="openGemini"></span><svg><use href="#i-external"/></svg></a></div>
<div class="section-heading"><h2 data-i18n="recent"></h2><button class="text-button" data-page="activity"><span data-i18n="viewAll"></span><svg><use href="#i-arrow"/></svg></button></div><div id="recent-history" class="recent-panel"></div>
</section>
<section id="page-connection" class="page" hidden>
<div class="page-heading"><div><h1 data-i18n="connection"></h1><p data-i18n="setupIntro"></p></div><button id="diagnose" class="button secondary"><svg><use href="#i-shield"/></svg><span data-i18n="diagnose"></span></button></div>
<div class="connection-grid"><div class="connection-main">
<div class="card"><div class="card-top"><h2 data-i18n="tunnelStatus"></h2><span id="tunnel-badge" class="small-pill"></span></div><div id="connection-status" class="notice"></div><div class="connection-actions"><button id="tunnel-toggle" class="button primary"><svg><use href="#i-link"/></svg><span></span></button><button id="copy-link" class="button secondary"><svg><use href="#i-copy"/></svg><span data-i18n="copyLink"></span></button></div><details class="disclosure"><summary data-i18n="privateAddress"></summary><div id="public-url" class="connection-url"></div><p class="footnote" data-i18n="privateHelp"></p></details></div>
<div class="card"><div class="card-top"><h2 data-i18n="account"></h2><span id="credential-badge" class="small-pill"></span></div><form id="connection-form"><label for="domain" data-i18n="domain"></label><input id="domain" type="url" autocomplete="off" spellcheck="false" data-i18n-placeholder="domainPlaceholder"><div class="field-label"><label for="authtoken" data-i18n="token"></label><a href="https://dashboard.ngrok.com/get-started/your-authtoken" target="_blank" rel="noreferrer" data-i18n="getToken"></a></div><input id="authtoken" type="password" autocomplete="new-password" spellcheck="false" data-i18n-placeholder="tokenPlaceholder"><p id="token-status" class="field-hint"></p><label class="checkbox"><input id="auto-start" type="checkbox"><span><span data-i18n="autoStart"></span><small data-i18n="autoStartHelp"></small></span></label><div class="form-bottom"><button id="tunnel-save" type="submit" class="button secondary" data-i18n="save"></button><a href="https://dashboard.ngrok.com/domains" target="_blank" rel="noreferrer" data-i18n="domains"></a></div></form></div>
<div class="card"><h2 data-i18n="firstUse"></h2><div class="help-step"><span>1</span><div><strong data-i18n="setupOne"></strong><p data-i18n="setupOneHelp"></p><a href="https://gemini.google.com/customize/connectors?hl=en" target="_blank" rel="noreferrer" data-i18n="appsPage"></a></div></div><div class="help-step"><span>2</span><div><strong data-i18n="setupTwo"></strong><p data-i18n="setupTwoHelp"></p></div></div><div class="help-step"><span>3</span><div><strong data-i18n="setupThree"></strong><p data-i18n="setupThreeHelp"></p></div></div><details class="disclosure"><summary data-i18n="allowTitle"></summary><p data-i18n="allowHelp"></p></details></div>
<div class="card"><h2 data-i18n="capabilities"></h2><p data-i18n="capabilityHelp"></p><p data-i18n="batchHelp"></p><p class="footnote" data-i18n="boundaries"></p></div>
<div id="diagnostic-result" class="card diagnostic-result" hidden></div>
</div><aside>
<div class="card usage-card"><h2 data-i18n="usage"></h2><div class="usage-number"><strong id="request-count">0</strong><span data-i18n="requests"></span></div><div class="usage-detail"><span data-i18n="responseSize"></span><b id="response-size">0 KB</b></div><div class="usage-detail"><span data-i18n="lastRequest"></span><b id="last-request"></b></div><p class="footnote" data-i18n="usageHelp"></p><div class="usage-links"><a href="https://dashboard.ngrok.com/usage" target="_blank" rel="noreferrer" data-i18n="ngrokUsage"></a><a href="https://gemini.google.com/usage" target="_blank" rel="noreferrer" data-i18n="geminiUsage"></a></div><p class="footnote" data-i18n="quotas"></p></div>
<div class="card"><h2 data-i18n="network"></h2><p data-i18n="networkHelp"></p><p class="footnote" data-i18n="networkHelpTwo"></p></div>
<div class="card"><h2 data-i18n="privacy"></h2><p data-i18n="privacyHelp"></p></div>
<details class="card advanced-card"><summary data-i18n="advanced"></summary><h3 data-i18n="events"></h3><pre id="tunnel-events"></pre><h3 data-i18n="protocol"></h3><pre id="protocol-log"></pre><p class="footnote" data-i18n="rotateHelp"></p><button id="rotate-key" class="button secondary"><svg><use href="#i-shield"/></svg><span data-i18n="rotate"></span></button></details>
</aside></div>
</section>
<section id="page-activity" class="page" hidden>
<div class="page-heading"><div><h1 data-i18n="activity"></h1><p data-i18n="activityIntro"></p></div><span id="activity-count" class="quiet"></span></div><div class="card activity-card"><div class="activity-toolbar"><div class="filter-group"><button data-filter="all" class="filter-button active" data-i18n="all"></button><button data-filter="failed" class="filter-button" data-i18n="failures"></button></div><span class="quiet" data-i18n="historyLimit"></span></div><div id="history"></div></div>
</section>
<footer class="page-footer"><span><svg><use href="#i-shield"/></svg><span data-i18n="localOnly"></span></span><span>ArgonDesk · <span data-i18n="appNote"></span></span></footer>
</div></main></div>
<div id="message" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="preferences-dialog"><div class="dialog-heading"><h2 data-i18n="preferences"></h2><span class="quiet">v0.4.1</span></div><label for="language" data-i18n="language"></label><select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select><p class="footnote" data-i18n="languageHelp"></p><div class="dialog-actions"><button id="preferences-close" class="button primary" data-i18n="close"></button></div></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-description"></p><div class="dialog-actions"><button id="confirm-cancel" class="button secondary" data-i18n="cancel"></button><button id="confirm-ok" class="button primary"></button></div></dialog>
<script type="module" src="/app.js"></script>
</body></html>
